name: Daily AISecHub Digest

on:
  schedule:
    # 07:00 Singapore Time (SGT = UTC+8) = 23:00 UTC the previous day
    - cron: '0 23 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main  # Also run on every push so GitHub doesn't disable the schedule

# Prevent multiple runs overlapping — if a new run starts, wait for current one to finish
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so rebase has context

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Verify API key is set
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ERROR: ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi
          echo "API key is present."

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_OUTPUT_DIR: ./docs
        run: python run_digest.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit — digest already up to date."
            exit 0
          fi
          # Use SGT date for the commit message and filename consistency
          SGT_DATE=$(TZ='Asia/Singapore' date +%Y-%m-%d)
          git commit -m "digest: ${SGT_DATE}"

          # Retry push up to 3 times, rebasing on each failure
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push origin main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed — rebasing on latest remote and retrying..."
            git pull --rebase origin main
          done

          echo "ERROR: Could not push after 3 attempts."
          exit 1
