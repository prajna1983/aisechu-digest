name: Daily AISecHub Digest

on:
  schedule:
    # 07:00 Singapore Time (SGT = UTC+8) = 23:00 UTC the previous day
    - cron: '0 23 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab — use this for the first run

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the generated HTML back to the repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Verify API key is set
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ERROR: ANTHROPIC_API_KEY secret is not set."
            echo "Go to repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "API key is present."

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_OUTPUT_DIR: ./docs
        run: python run_digest.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "No changes to commit — digest may already be up to date."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            # Pull any commits that arrived since the job started, then push
            git pull --rebase origin main
            git push
            echo "Digest committed and pushed successfully."
          fi
