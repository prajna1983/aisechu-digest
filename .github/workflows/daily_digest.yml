name: Daily AISecHub Digest

on:
  schedule:
    # Runs every day at 07:00 UTC (adjust to your preferred time)
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Also allows you to trigger a run manually from the GitHub Actions tab

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the generated HTML back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_OUTPUT_DIR: ./docs
        run: python run_digest.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
